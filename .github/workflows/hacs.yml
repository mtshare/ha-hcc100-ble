name: HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
