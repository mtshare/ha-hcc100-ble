[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hcc100-ble-local"
version = "0.1.3"
description = "Experimental local Resideo HCC100 BLE reader and Home Assistant integration"
requires-python = ">=3.13"
dependencies = ["bleak>=1.1,<4", "cryptography>=44,<51"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.11"]

[project.scripts]
hcc100-ble = "hcc100_ble.cli:main"

[tool.setuptools]
packages = ["hcc100_ble"]
package-dir = {hcc100_ble = "custom_components/hcc100_local/ble"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
